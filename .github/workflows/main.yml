name: Build AM-Trading Windows

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"
  QT_MODULES: "qtcharts qtwebsockets qtmultimedia qtlocation qtpositioning"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install OpenSSL
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }

          & "$vcpkg\vcpkg.exe" install openssl:x64-windows --no-print-usage

          "OPENSSL_ROOT_DIR=$vcpkg\installed\x64-windows" | Out-File $env:GITHUB_ENV -Append

      - name: Configure CMake
        shell: pwsh
        working-directory: FinceptTerminal-personal-dev/fincept-qt
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF `
            -DCMAKE_CXX_FLAGS="/WX-" `
            -DCMAKE_C_FLAGS="/WX-"

      - name: Build
        shell: pwsh
        working-directory: FinceptTerminal-personal-dev/fincept-qt
        run: |
          cmake --build build --config Release --parallel 2

      - name: Package Application
        shell: pwsh
        working-directory: FinceptTerminal-personal-dev/fincept-qt
        run: |

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Copy main exe
          Copy-Item "build\Release\FinceptTerminal.exe" "dist\" -Force

          # Deploy Qt DLLs
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            --force `
            "dist\FinceptTerminal.exe"

          # Copy qgeoview.dll automatically if exists
          $dll = Get-ChildItem build -Recurse -Filter qgeoview.dll | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName dist -Force
          }

          # Copy all extra DLL files from build folder
          Get-ChildItem build -Recurse -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName dist -Force
          }

          # Copy OpenSSL DLLs
          Copy-Item "$env:OPENSSL_ROOT_DIR\bin\*.dll" dist -Force -ErrorAction SilentlyContinue

          # Copy resources
          if (Test-Path resources) {
            Copy-Item resources dist\resources -Recurse -Force
          }

          if (Test-Path scripts) {
            Copy-Item scripts dist\scripts -Recurse -Force
          }

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: AM-Trading-Windows-x64
          path: FinceptTerminal-personal-dev/fincept-qt/dist
