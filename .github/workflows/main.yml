name: Build AM-Trading Windows

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"
  QT_MODULES: "qtcharts qtwebsockets qtmultimedia"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install OpenSSL
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            $vcpkgRoot = "C:\vcpkg"
          }

          & "$vcpkgRoot\vcpkg.exe" install openssl:x64-windows --no-print-usage

          "OPENSSL_ROOT_DIR=$vcpkgRoot\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure CMake
        shell: pwsh
        working-directory: FinceptTerminal-personal-dev/fincept-qt
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF `
            -DCMAKE_CXX_FLAGS="/WX-" `
            -DCMAKE_C_FLAGS="/WX-"

      - name: Force disable warnings as errors
        shell: pwsh
        working-directory: FinceptTerminal-personal-dev/fincept-qt
        run: |
          Get-ChildItem "build" -Recurse -Filter "*.vcxproj" | ForEach-Object {
            $file = $_.FullName
            $text = Get-Content $file -Raw

            $text = $text -replace "<TreatWarningAsError>true</TreatWarningAsError>", "<TreatWarningAsError>false</TreatWarningAsError>"
            $text = $text -replace "<TreatWarningAsError>True</TreatWarningAsError>", "<TreatWarningAsError>false</TreatWarningAsError>"
            $text = $text -replace "<TreatWarningAsError>TRUE</TreatWarningAsError>", "<TreatWarningAsError>false</TreatWarningAsError>"
            $text = $text -replace "<TreatSpecificWarningsAsErrors>.*?</TreatSpecificWarningsAsErrors>", "<TreatSpecificWarningsAsErrors></TreatSpecificWarningsAsErrors>"
            $text = $text -replace "/WX(?!-)", "/WX-"

            Set-Content $file $text -Encoding UTF8
          }

      - name: Build
        shell: pwsh
        working-directory: FinceptTerminal-personal-dev/fincept-qt
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 1

      - name: Package Windows app
        shell: pwsh
        working-directory: FinceptTerminal-personal-dev/fincept-qt
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1) Find and copy the main executable
          $exe = Get-ChildItem "build" -Recurse -Filter "FinceptTerminal.exe" |
            Where-Object { $_.FullName -match "\\Release\\" } |
            Select-Object -First 1

          if (-not $exe) {
            $exe = Get-ChildItem "build" -Recurse -Filter "FinceptTerminal.exe" | Select-Object -First 1
          }

          if (-not $exe) {
            Get-ChildItem build -Recurse -Filter "*.exe"
            throw "FinceptTerminal.exe not found"
          }

          Copy-Item $exe.FullName "dist\" -Force

          # 2) Copy project-built DLLs, especially qgeoview.dll
          $projectDlls = Get-ChildItem "build" -Recurse -Filter "*.dll" |
            Where-Object {
              $_.FullName -match "\\Release\\" -or
              $_.Name -ieq "qgeoview.dll"
            }

          foreach ($dll in $projectDlls) {
            Copy-Item $dll.FullName "dist\" -Force
          }

          # 3) Fail early if qgeoview.dll was not packaged
          if (-not (Test-Path "dist\qgeoview.dll")) {
            Write-Host "DLL files found in build directory:"
            Get-ChildItem "build" -Recurse -Filter "*.dll" | Select-Object FullName
            throw "qgeoview.dll was not found in the build output. The app will not run without it."
          }

          # 4) Copy OpenSSL runtime DLLs from vcpkg
          if (Test-Path "$env:OPENSSL_ROOT_DIR\bin") {
            Copy-Item "$env:OPENSSL_ROOT_DIR\bin\*.dll" "dist\" -Force
          }

          # 5) Deploy Qt runtime dependencies
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --no-translations `
            --compiler-runtime `
            --force `
            "dist\FinceptTerminal.exe"

          # 6) Copy application resources
          if (Test-Path "resources") {
            Copy-Item "resources" "dist\resources" -Recurse -Force
          }

          if (Test-Path "scripts") {
            Copy-Item "scripts" "dist\scripts" -Recurse -Force
          }

          # 7) Print final package contents for debugging
          Write-Host "Final dist contents:"
          Get-ChildItem "dist" | Sort-Object Name | Select-Object Name, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: AM-Trading-Windows-x64
          path: FinceptTerminal-personal-dev/fincept-qt/dist
